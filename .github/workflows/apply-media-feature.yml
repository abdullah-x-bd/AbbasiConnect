name: Apply media feature

on:
  push:
    branches:
      - feature/post-profile-images
    paths:
      - .github/workflows/apply-media-feature.yml
      - scripts/apply-media-feature.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-profile-images
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply media changes
        run: python scripts/apply-media-feature.py
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        id: prisma
        shell: bash
        run: |
          set +e
          npm run db:generate > prisma-output.txt 2>&1
          code=$?
          cat prisma-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve Prisma error for inspection
        if: steps.prisma.outputs.code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma-output.txt
          git commit -m "Capture media feature Prisma error"
          git push origin HEAD:feature/post-profile-images
          exit 1
      - name: Build API and web
        if: steps.prisma.outputs.code == '0'
        run: npm run build
      - name: Commit verified feature
        if: steps.prisma.outputs.code == '0'
        run: |
          rm .github/workflows/apply-media-feature.yml scripts/apply-media-feature.py prisma-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional images to posts and profiles"
          git push origin HEAD:feature/post-profile-images
