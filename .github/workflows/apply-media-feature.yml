name: Apply media feature

on:
  push:
    branches:
      - feature/post-profile-images
    paths:
      - .github/workflows/apply-media-feature.yml
      - scripts/apply-media-feature.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://abbasi:abbasi_dev_password@localhost:5432/abbasiconnect?schema=public
      JWT_SECRET: ci-only-secret
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-profile-images
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply media changes
        run: python scripts/apply-media-feature.py
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build API and web
        run: npm run build
      - name: Commit verified feature
        run: |
          rm .github/workflows/apply-media-feature.yml scripts/apply-media-feature.py prisma-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optional images to posts and profiles"
          git push origin HEAD:feature/post-profile-images
