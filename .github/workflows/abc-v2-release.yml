name: Publish ABC v1.4 direct APK

on:
  workflow_run:
    workflows: ["ABC Bahishti Android APK"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful ABC Android build run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: abc-bahishti-v1.4.0
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from this exact successful Android build
        run: |
          set -euo pipefail
          mkdir -p abc-apk
          RUN_ID="${{ github.event.workflow_run.id || inputs.build_run_id || '' }}"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name ABC-Bahishti-Android-APK --dir abc-apk
          test -s abc-apk/app-release.apk
          cp abc-apk/app-release.apk ABC-Bahishti-Connections-v1.4.apk
          file ABC-Bahishti-Connections-v1.4.apk
          ls -lh ABC-Bahishti-Connections-v1.4.apk
      - name: Publish direct-install APK
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ABC-Bahishti-Connections-v1.4.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ABC-Bahishti-Connections-v1.4.apk --repo "$GITHUB_REPOSITORY" --target main --title "ABC Bahishti Connections v1.4" --notes "ABC v1.4: adaptive seven-group interview, default Hinglish or English choice, inferred gender, marital choice, keyboard-aware Android chat, inline mic transcription with manual Send, tap-to-speak replies, three-irrelevant-response deferral, one-time optional photo offer, early duplicate-number redirect. Existing WhatsApp 1080×1350 JPEG retained. Temporary phone verification remains unchanged." --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
