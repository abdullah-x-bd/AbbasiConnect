name: ABC Bahishti Android APK

on:
  push:
    branches: [main, "feature/abc-biodata-whatsapp-v13", "feature/abc-onboarding-surgical-v14", "feature/abc-roman-cleanup-enrichment-delete-v15", "feature/abc-ivory-forest-brand-v16", "feature/abc-auto-cheap-voice-cleanup-v161"]
    paths:
      - "apps/bahishti/**"
      - ".github/workflows/abc-android-apk.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://abbasiconnect-api.onrender.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Verify ABC TypeScript
        run: npm run typecheck -w @abbasiconnect/bahishti
      - name: Generate separate ABC Android project
        working-directory: apps/bahishti
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Compile standalone installable APK
        working-directory: apps/bahishti/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace
      - name: Verify app package
        run: |
          test -s apps/bahishti/android/app/build/outputs/apk/release/app-release.apk
          ls -lh apps/bahishti/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ABC-Bahishti-Android-APK
          path: apps/bahishti/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
