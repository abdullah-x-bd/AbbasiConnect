name: Cleanup media branch

on:
  push:
    branches:
      - feature/post-profile-images
    paths:
      - .github/workflows/cleanup-media-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/post-profile-images
          fetch-depth: 0
      - name: Remove generated files
        run: |
          rm -rf apps/api/dist
          rm -f apps/web/tsconfig.tsbuildinfo package-lock.json
          rm .github/workflows/cleanup-media-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated build artifacts"
          git push origin HEAD:feature/post-profile-images
