name: Check live AbbasiConnect API

on:
  push:
    paths:
      - ".github/workflows/render-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check Render API health
        run: |
          curl --fail-with-body --location --silent --show-error \
            --retry 8 --retry-delay 10 --retry-all-errors --connect-timeout 15 \
            --max-time 45 https://abbasiconnect-api.onrender.com/health \
            -o /tmp/abbasiconnect-health.json
          cat /tmp/abbasiconnect-health.json
          grep -q '"ok":true' /tmp/abbasiconnect-health.json
