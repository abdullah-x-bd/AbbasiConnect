name: ABC Bahishti quality checks

on:
  push:
    branches: [main, "feature/abc-biodata-whatsapp-v13", "feature/abc-onboarding-surgical-v14", "feature/abc-roman-cleanup-enrichment-delete-v15", "feature/abc-ivory-forest-brand-v16", "feature/abc-auto-cheap-voice-cleanup-v161", "feature/abc-gpt-live-voice-onboarding-v17", "feature/abc-voice-guardrails-v171", "feature/abc-voice-turntaking-v18", "feature/abc-biodata-contact-v162"]
    paths:
      - "apps/api/src/abc/**"
      - "apps/api/tests/abc-fields.test.mjs"
      - "apps/api/tests/abc-cleanup.test.mjs"
      - "apps/api/tests/abc-voice-policy.test.mjs"
      - "apps/api/tests/abc-biodata.test.mjs"
      - "apps/api/tests/abc-biodata-preview.mjs"
      - "apps/api/package.json"
      - "apps/api/prisma/schema.prisma"
      - "apps/api/src/server-v2.ts"
      - "apps/api/src/types.ts"
      - "apps/bahishti/**"
      - ".github/workflows/abc-ci.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/abc_compile_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck and build API
        run: npm run build -w @abbasiconnect/api
      - name: Validate ABC state engine
        run: node --import tsx --test apps/api/tests/abc-fields.test.mjs
      - name: Validate Gemini Roman-script cleanup with a mocked model
        run: node --import tsx --test apps/api/tests/abc-cleanup.test.mjs
      - name: Test enforced voice time, silence and five-distraction rules
        run: node --import tsx --test apps/api/tests/abc-voice-policy.test.mjs
      - name: Test shareable JPEG biodata rendering and photo security
        run: node --import tsx --test apps/api/tests/abc-biodata.test.mjs
      - name: Render actual WhatsApp 4:5 biodata preview
        run: node --import tsx apps/api/tests/abc-biodata-preview.mjs
      - name: Retain generated 1080x1350 JPEG for visual audit
        uses: actions/upload-artifact@v4
        with:
          name: ABC-WhatsApp-Biodata-v1.3-Preview
          path: abc-biodata-preview/ABC-Biodata-v1.3-Sample.jpg
          if-no-files-found: error
          retention-days: 30
      - name: Verify supplied ABC emblem and ivory-green theme
        run: node --test apps/bahishti/tests/brand-theme.test.mjs
      - name: Validate voice-call limits, delegation fallback, and text-only Chat
        run: node --test apps/bahishti/tests/voice-guardrails.test.mjs
      - name: Test voice transcript buffering and WebRTC audio levels
        run: node --import tsx --test apps/bahishti/tests/voice-turns.test.mjs
      - name: Typecheck ABC Android app
        run: npm run typecheck -w @abbasiconnect/bahishti
