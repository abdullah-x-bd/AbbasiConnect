name: Live backend authentication probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-auth-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify health and authentication error handling
        run: |
          echo "Health endpoint:"
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 --max-time 40 https://abbasiconnect-api.onrender.com/health
          echo
          echo "Attempting intentionally invalid login without changing data:"
          for attempt in 1 2 3; do
            echo "Attempt $attempt"
            code=$(curl -sS --max-time 40 -o /tmp/auth-response -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -d '{"username":"qa_nonexistent_172","password":"invalidQATest2026"}' \
              https://abbasiconnect-api.onrender.com/auth/sign-in)
            echo "HTTP $code"
            if [ "$code" = "401" ] && grep -q 'Incorrect username or password' /tmp/auth-response; then
              echo "PASS: invalid login correctly rejected"
              exit 0
            fi
            echo "FAIL: expected HTTP 401 from valid authentication service, got HTTP $code"
            sleep 3
          done

          echo "Backend authentication is unhealthy"
          exit 1
