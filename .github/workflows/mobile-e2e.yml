name: Full live AbbasiConnect API integration tests

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/tests/live-e2e.mjs"
      - ".github/workflows/mobile-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise live Render and Supabase system with isolated QA accounts
        run: node apps/mobile/tests/live-e2e.mjs
