name: ABC v2 real phone PIN and onboarding end-to-end

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/abc/**"
      - "apps/api/tests/abc-v2-live.mjs"
      - "apps/api/prisma/schema.prisma"
      - ".github/workflows/abc-v2-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ABC_CAPTURE_JPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the NEW optional-details and biodata endpoints
        run: |
          for i in $(seq 1 45); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
              https://abbasiconnect-api.onrender.com/abc/enrichment || true)
            if [ "$status" = "401" ]; then
              echo "ABC biodata/enrichment deployment is available"
              exit 0
            fi
            sleep 10
          done
          echo "New registration service did not become live"
          exit 1
      - name: Test persistent login, concise AI, biodata and optional details
        run: node apps/api/tests/abc-v2-live.mjs
      - name: Upload genuine JPEG sample for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABC-v1.2-Biodata-Sample
          path: abc-jpeg-evidence/
          if-no-files-found: warn
          retention-days: 14
