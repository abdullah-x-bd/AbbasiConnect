name: ABC v2 real phone PIN and onboarding end-to-end

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/abc/**"
      - "apps/api/tests/abc-v2-live.mjs"
      - "apps/api/prisma/schema.prisma"
      - ".github/workflows/abc-v2-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ABC_CAPTURE_JPEG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the EXACT newly deployed voice contract
        run: |
          for i in $(seq 1 60); do
            contract=$(curl -fsS --max-time 20 https://abbasiconnect-api.onrender.com/abc/health || true)
            if echo "$contract" | grep -q '"voiceContract":"canonical-question-v2.1"'; then
              echo "ABC canonical voice backend is live"
              exit 0
            fi
            sleep 10
          done
          echo "ABC voice backend release has not deployed yet"
          exit 1
      - name: Test persistent login, concise AI, biodata and optional details
        run: node apps/api/tests/abc-v2-live.mjs
      - name: Upload genuine JPEG sample for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABC-v1.4-Biodata-Sample
          path: abc-jpeg-evidence/
          if-no-files-found: warn
          retention-days: 14
