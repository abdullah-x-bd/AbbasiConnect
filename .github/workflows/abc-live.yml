name: ABC live deployment and OpenRouter tests

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/abc/**"
      - "apps/api/tests/abc-live.mjs"
      - "apps/api/prisma/schema.prisma"
      - ".github/workflows/abc-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for ABC Render deployment
        run: |
          for i in $(seq 1 35); do
            if curl -fsS --max-time 25 https://abbasiconnect-api.onrender.com/abc/health | grep -q 'abbasi-bahishti-connections'; then
              echo "ABC API is responding"
              exit 0
            fi
            sleep 10
          done
          echo "ABC service did not become healthy"
          exit 1
      - name: Run actual onboarding and AI extraction scenarios
        run: node apps/api/tests/abc-live.mjs
