name: ABC live deployment and OpenRouter tests

on:
  push:
    branches: [main]
    paths:
      - "apps/api/src/abc/**"
      - "apps/api/tests/abc-live.mjs"
      - "apps/api/prisma/schema.prisma"
      - ".github/workflows/abc-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for ABC v1.7 deployment (not just the old health endpoint)
        run: |
          for i in $(seq 1 45); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 \
              -X POST -H 'content-type: application/json' -d '{"sdp":"invalid"}' \
              https://abbasiconnect-api.onrender.com/abc/live/connect || true)
            if [ "$status" = "401" ]; then
              echo "ABC live voice endpoint deployed"
              exit 0
            fi
            sleep 10
          done
          echo "New ABC live voice endpoint not available"
          exit 1
      - name: Run actual onboarding and AI extraction scenarios
        run: node apps/api/tests/abc-live.mjs
