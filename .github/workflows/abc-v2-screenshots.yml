name: ABC v2 every-screen native screenshots

on:
  push:
    branches: ["feature/abc-short-onboarding-biodata",main]
    paths:
      - "apps/bahishti/**"
      - ".github/workflows/abc-v2-screenshots.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_ABC_PREVIEW: "1"
      EXPO_PUBLIC_API_URL: "https://abbasiconnect-api.onrender.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Typecheck minimalist UI
        run: npm run typecheck -w @abbasiconnect/bahishti
      - name: Generate screenshot-only Android app
        working-directory: apps/bahishti
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build screenshot-only APK
        working-directory: apps/bahishti/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2
      - name: Allow Android emulator virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture every actual screen on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r apps/bahishti/android/app/build/outputs/apk/release/app-release.apk && python3 apps/bahishti/tests/v2-screenshots.py
      - name: Upload 19 screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ABC-V2-ALL-SCREENS
          path: abc-v2-screenshots/
          retention-days: 30
          if-no-files-found: warn
