services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: abbasiconnect
      POSTGRES_USER: abbasi
      POSTGRES_PASSWORD: abbasi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - abbasi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abbasi -d abbasiconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  abbasi_postgres_data:
